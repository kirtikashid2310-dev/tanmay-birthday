<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Tanmay</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #070605;
            color: #eee7de;
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        /* =========================
           CINEMATIC FRAME
        ========================= */

        .opening {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at 50% 48%,
                    rgba(94, 67, 47, 0.20) 0%,
                    rgba(42, 30, 22, 0.10) 30%,
                    rgba(7, 6, 5, 1) 72%
                );

            animation: roomLight 10s ease-in-out infinite alternate;
        }

        @keyframes roomLight {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.018);
            }
        }

        /* =========================
           FILM GRAIN
        ========================= */

        .grain {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;

            pointer-events: none;
            z-index: 20;

            opacity: 0.045;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");

            animation: grainMove 0.25s steps(2) infinite;
        }

        @keyframes grainMove {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-1%, 1%);
            }

            50% {
                transform: translate(1%, -1%);
            }

            75% {
                transform: translate(1%, 1%);
            }

            100% {
                transform: translate(-1%, -1%);
            }
        }

        /* =========================
           SOFT CINEMATIC LIGHT
        ========================= */

        .light {
            position: absolute;

            width: 55vw;
            height: 55vw;

            max-width: 700px;
            max-height: 700px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(125, 91, 64, 0.10) 0%,
                    rgba(125, 91, 64, 0.025) 42%,
                    transparent 70%
                );

            filter: blur(20px);

            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%,
            100% {
                opacity: 0.55;
                transform: translate(-50%, -50%) scale(0.95);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.08);
            }
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .content {
            position: absolute;

            z-index: 10;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 90%;

            text-align: center;
        }

        .hello {
            font-size: clamp(2.7rem, 6vw, 5.2rem);

            font-weight: 400;

            letter-spacing: 0.025em;

            opacity: 0;

            animation:
                helloAppear 2.8s cubic-bezier(.22,.61,.36,1) 0.8s forwards,
                gentleFloat 8s ease-in-out 3.6s infinite;
        }

        @keyframes helloAppear {
            from {
                opacity: 0;
                transform: translateY(18px);
                filter: blur(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes gentleFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        /* =========================
           DATE
        ========================= */

        .date {
            margin-top: 32px;

            font-size: clamp(0.8rem, 1.4vw, 1.05rem);

            font-weight: 300;

            letter-spacing: 0.45em;

            margin-left: 0.45em;

            color: #b5a99c;

            opacity: 0;

            animation: dateAppear 2s ease 2.4s forwards;
        }

        @keyframes dateAppear {
            from {
                opacity: 0;
                letter-spacing: 0.7em;
            }

            to {
                opacity: 0.88;
                letter-spacing: 0.45em;
            }
        }

        /* =========================
           THIN DIVIDER
        ========================= */

        .divider {
            width: 90px;

            height: 1px;

            margin: 25px auto 0;

            background: rgba(200, 186, 170, 0.35);

            transform: scaleX(0);

            animation: dividerAppear 1.5s ease 3.4s forwards;
        }

        .divider::after {
            content: "";

            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #c4a98c;
        }

        @keyframes dividerAppear {
            to {
                transform: scaleX(1);
            }
        }

        /* =========================
           BIRTHDAY LINE
        ========================= */

        .birthday {
            margin-top: 24px;

            font-size: clamp(1.15rem, 2vw, 1.65rem);

            font-weight: 300;

            letter-spacing: 0.035em;

            color: #ddd3c9;

            opacity: 0;

            animation: birthdayAppear 2.2s ease 3.7s forwards;
        }

        @keyframes birthdayAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 0.94;
                transform: translateY(0);
            }
        }

        /* =========================
           CINEMATIC STARS
        ========================= */

        .star {
            position: absolute;

            z-index: 4;

            width: 14px;
            height: 14px;

            opacity: 0;

            animation: starTwinkle 5s ease-in-out infinite;
        }

        .star::before,
        .star::after {
            content: "";

            position: absolute;

            left: 50%;
            top: 50%;

            background: #c4aa8e;

            transform: translate(-50%, -50%);
        }

        .star::before {
            width: 1px;
            height: 14px;
        }

        .star::after {
            width: 14px;
            height: 1px;
        }

        .star1 {
            left: 16%;
            top: 25%;
            animation-delay: 0.5s;
        }

        .star2 {
            right: 19%;
            top: 31%;

            transform: scale(0.75);

            animation-delay: 2.2s;
        }

        .star3 {
            left: 26%;
            bottom: 23%;

            transform: scale(0.65);

            animation-delay: 1.5s;
        }

        .star4 {
            right: 27%;
            bottom: 20%;

            transform: scale(0.8);

            animation-delay: 3.5s;
        }

        @keyframes starTwinkle {
            0%,
            100% {
                opacity: 0.10;
                transform: scale(0.75) rotate(0deg);
            }

            50% {
                opacity: 0.65;
                transform: scale(1.15) rotate(45deg);
            }
        }

        /* =========================
           FLOATING DUST
        ========================= */

        .dust {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #c2a789;

            opacity: 0;

            z-index: 4;

            animation: dustFloat 9s ease-in-out infinite;
        }

        .dust1 {
            left: 34%;
            top: 23%;
            animation-delay: 1s;
        }

        .dust2 {
            left: 70%;
            top: 25%;
            animation-delay: 4s;
        }

        .dust3 {
            left: 20%;
            top: 62%;
            animation-delay: 2s;
        }

        .dust4 {
            left: 76%;
            top: 66%;
            animation-delay: 5s;
        }

        .dust5 {
            left: 43%;
            top: 76%;
            animation-delay: 3s;
        }

        @keyframes dustFloat {
            0%,
            100% {
                opacity: 0;
                transform: translate(0, 8px);
            }

            40% {
                opacity: 0.4;
            }

            60% {
                opacity: 0.22;
                transform: translate(8px, -12px);
            }
        }

        /* =========================
           CRESCENT MOON
        ========================= */

        .moon {
            position: absolute;

            width: 42px;
            height: 42px;

            right: 13%;
            top: 16%;

            z-index: 4;

            opacity: 0;

            animation:
                moonAppear 3s ease 1.5s forwards,
                moonFloat 8s ease-in-out 4.5s infinite;
        }

        .moon svg {
            width: 100%;
            height: 100%;
        }

        .moon path {
            fill: none;

            stroke: #c0a486;

            stroke-width: 1;
        }

        @keyframes moonAppear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 0.55;
                transform: translateY(0);
            }
        }

        @keyframes moonFloat {
            0%,
            100% {
                transform: translateY(0) rotate(-8deg);
            }

            50% {
                transform: translateY(-8px) rotate(2deg);
            }
        }

        /* =========================
           CURVED LINES
        ========================= */

        .curve {
            position: absolute;

            width: 300px;
            height: 150px;

            opacity: 0.18;

            pointer-events: none;

            z-index: 2;
        }

        .curve svg {
            width: 100%;
            height: 100%;
        }

        .curve path {
            fill: none;

            stroke: #a88b6f;

            stroke-width: 0.8;
        }

        .curve1 {
            top: -30px;
            left: -50px;

            transform: rotate(-8deg);
        }

        .curve2 {
            bottom: -40px;
            right: -50px;

            transform: rotate(8deg);
        }

        /* =========================
           SUBTLE VIGNETTE
        ========================= */

        .vignette {
            position: absolute;

            inset: 0;

            z-index: 15;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 40%,
                    rgba(0,0,0,0.22) 72%,
                    rgba(0,0,0,0.65) 100%
                );
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .hello {
                font-size: 3rem;
            }

            .date {
                font-size: 0.75rem;

                letter-spacing: 0.3em;

                margin-left: 0.3em;
            }

            .birthday {
                font-size: 1.2rem;
            }

            .moon {
                right: 8%;
                top: 13%;
            }

            .star1 {
                left: 10%;
            }

            .star2 {
                right: 10%;
            }

            .curve1 {
                left: -130px;
            }

            .curve2 {
                right: -130px;
            }
        }
    </style>
</head>

<body>

    <main class="opening">

        <!-- Soft cinematic light -->
        <div class="light"></div>


        <!-- =====================
             STARS
        ====================== -->

        <div class="star star1"></div>
        <div class="star star2"></div>
        <div class="star star3"></div>
        <div class="star star4"></div>


        <!-- =====================
             FLOATING DUST
        ====================== -->

        <div class="dust dust1"></div>
        <div class="dust dust2"></div>
        <div class="dust dust3"></div>
        <div class="dust dust4"></div>
        <div class="dust dust5"></div>


        <!-- =====================
             CRESCENT MOON
        ====================== -->

        <div class="moon">

            <svg viewBox="0 0 40 40">

                <path d="
                    M29 6
                    C20 8, 14 15, 14 23
                    C14 31, 20 35, 28 34
                    C22 32, 18 27, 18 21
                    C18 14, 22 9, 29 6
                "/>

            </svg>

        </div>


        <!-- =====================
             CURVED LINES
        ====================== -->

        <div class="curve curve1">

            <svg viewBox="0 0 300 150">

                <path d="
                    M0 110
                    C70 35, 160 25, 300 70
                "/>

            </svg>

        </div>


        <div class="curve curve2">

            <svg viewBox="0 0 300 150">

                <path d="
                    M0 75
                    C100 20, 200 35, 300 120
                "/>

            </svg>

        </div>


        <!-- =====================
             MAIN TEXT
        ====================== -->

        <div class="content">

            <div class="hello">
                Hi babyyyyyy
            </div>

            <div class="date">
                27 . 09 . 2026
            </div>

            <div class="divider"></div>

            <div class="birthday">
                Happy birthday, my love.
            </div>

        </div>


        <!-- Film grain -->
        <div class="grain"></div>


        <!-- Vignette -->
        <div class="vignette"></div>

    </main>

</body>
</html>
