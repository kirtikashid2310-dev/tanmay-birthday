<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Tanmay</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #070605;
            color: #eee7de;
            font-family: 'Cormorant Garamond', Georgia, serif;
        }


        /* ==================================================
           GENERAL
        ================================================== */

        .screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }


        /* ==================================================
           OPENING
        ================================================== */

        .opening {
            position: absolute;
            inset: 0;
            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at 50% 48%,
                    rgba(94, 67, 47, 0.20) 0%,
                    rgba(42, 30, 22, 0.10) 30%,
                    rgba(7, 6, 5, 1) 72%
                );

            animation:
                roomLight 10s ease-in-out infinite alternate,
                openingFadeOut 2s ease 10s forwards;
        }

        @keyframes roomLight {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.018);
            }
        }

        @keyframes openingFadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                visibility: hidden;
            }
        }


        /* ==================================================
           SOFT LIGHT
        ================================================== */

        .light {
            position: absolute;

            width: 55vw;
            height: 55vw;

            max-width: 700px;
            max-height: 700px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(125, 91, 64, 0.10) 0%,
                    rgba(125, 91, 64, 0.025) 42%,
                    transparent 70%
                );

            filter: blur(20px);

            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%,
            100% {
                opacity: 0.55;
                transform: translate(-50%, -50%) scale(0.95);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.08);
            }
        }


        /* ==================================================
           OPENING TEXT
        ================================================== */

        .opening-content {
            position: relative;
            z-index: 10;

            width: 90%;

            text-align: center;
        }

        .hello {
            font-family: 'Great Vibes', cursive;

            font-size: clamp(2.2rem, 4.8vw, 4rem);

            font-weight: 400;

            letter-spacing: 0.02em;

            opacity: 0;

            animation:
                helloAppear 2.8s cubic-bezier(.22,.61,.36,1) 0.8s forwards,
                gentleFloat 8s ease-in-out 3.6s infinite;
        }

        @keyframes helloAppear {
            from {
                opacity: 0;
                transform: translateY(18px);
                filter: blur(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes gentleFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }


        /* ==================================================
           DATE
        ================================================== */

        .date {
            margin-top: 30px;

            font-size: clamp(0.8rem, 1.4vw, 1.05rem);

            font-weight: 300;

            letter-spacing: 0.45em;
            margin-left: 0.45em;

            color: #b5a99c;

            opacity: 0;

            animation: dateAppear 2s ease 2.4s forwards;
        }

        @keyframes dateAppear {
            from {
                opacity: 0;
                letter-spacing: 0.7em;
            }

            to {
                opacity: 0.88;
                letter-spacing: 0.45em;
            }
        }


        /* ==================================================
           DIVIDER
        ================================================== */

        .divider {
            width: 90px;
            height: 1px;

            margin: 25px auto 0;

            background: rgba(200, 186, 170, 0.35);

            transform: scaleX(0);

            animation: dividerAppear 1.5s ease 3.4s forwards;
        }

        @keyframes dividerAppear {
            to {
                transform: scaleX(1);
            }
        }


        /* ==================================================
           HAPPY BIRTHDAY
        ================================================== */

        .birthday {
            margin-top: 24px;

            font-size: clamp(1.4rem, 2.5vw, 2rem);

            font-weight: 300;

            letter-spacing: 0.035em;

            color: #ddd3c9;

            opacity: 0;

            animation:
                birthdayAppear 2.2s ease 3.7s forwards;
        }

        @keyframes birthdayAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 0.94;
                transform: translateY(0);
            }
        }


        /* ==================================================
           STARS
        ================================================== */

        .star {
            position: absolute;

            z-index: 4;

            width: 14px;
            height: 14px;

            opacity: 0;

            animation: starTwinkle 5s ease-in-out infinite;
        }

        .star::before,
        .star::after {
            content: "";

            position: absolute;

            left: 50%;
            top: 50%;

            background: #c4aa8e;

            transform: translate(-50%, -50%);
        }

        .star::before {
            width: 1px;
            height: 14px;
        }

        .star::after {
            width: 14px;
            height: 1px;
        }

        .star1 {
            left: 16%;
            top: 25%;
            animation-delay: 0.5s;
        }

        .star2 {
            right: 19%;
            top: 31%;
            transform: scale(0.75);
            animation-delay: 2.2s;
        }

        .star3 {
            left: 26%;
            bottom: 23%;
            transform: scale(0.65);
            animation-delay: 1.5s;
        }

        .star4 {
            right: 27%;
            bottom: 20%;
            transform: scale(0.8);
            animation-delay: 3.5s;
        }

        @keyframes starTwinkle {
            0%,
            100% {
                opacity: 0.10;
            }

            50% {
                opacity: 0.65;
            }
        }


        /* ==================================================
           DUST
        ================================================== */

        .dust {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #c2a789;

            opacity: 0;

            z-index: 4;

            animation: dustFloat 9s ease-in-out infinite;
        }

        .dust1 {
            left: 34%;
            top: 23%;
            animation-delay: 1s;
        }

        .dust2 {
            left: 70%;
            top: 25%;
            animation-delay: 4s;
        }

        .dust3 {
            left: 20%;
            top: 62%;
            animation-delay: 2s;
        }

        .dust4 {
            left: 76%;
            top: 66%;
            animation-delay: 5s;
        }

        .dust5 {
            left: 43%;
            top: 76%;
            animation-delay: 3s;
        }

        @keyframes dustFloat {
            0%,
            100% {
                opacity: 0;
                transform: translate(0, 8px);
            }

            40% {
                opacity: 0.4;
            }

            60% {
                opacity: 0.22;
                transform: translate(8px, -12px);
            }
        }


        /* ==================================================
           MOON
        ================================================== */

        .moon {
            position: absolute;

            width: 42px;
            height: 42px;

            right: 13%;
            top: 16%;

            z-index: 4;

            opacity: 0;

            animation:
                moonAppear 3s ease 1.5s forwards,
                moonFloat 8s ease-in-out 4.5s infinite;
        }

        .moon svg {
            width: 100%;
            height: 100%;
        }

        .moon path {
            fill: none;
            stroke: #c0a486;
            stroke-width: 1;
        }

        @keyframes moonAppear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 0.55;
                transform: translateY(0);
            }
        }

        @keyframes moonFloat {
            0%,
            100% {
                transform: translateY(0) rotate(-8deg);
            }

            50% {
                transform: translateY(-8px) rotate(2deg);
            }
        }


        /* ==================================================
           CURVED LINES
        ================================================== */

        .curve {
            position: absolute;

            width: 300px;
            height: 150px;

            opacity: 0.18;

            pointer-events: none;

            z-index: 2;
        }

        .curve svg {
            width: 100%;
            height: 100%;
        }

        .curve path {
            fill: none;
            stroke: #a88b6f;
            stroke-width: 0.8;
        }

        .curve1 {
            top: -30px;
            left: -50px;
            transform: rotate(-8deg);
        }

        .curve2 {
            bottom: -40px;
            right: -50px;
            transform: rotate(8deg);
        }


        /* ==================================================
           GRAIN
        ================================================== */

        .grain {
            position: absolute;

            inset: -50%;

            width: 200%;
            height: 200%;

            pointer-events: none;

            z-index: 20;

            opacity: 0.045;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");

            animation: grainMove 0.25s steps(2) infinite;
        }

        @keyframes grainMove {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-1%, 1%);
            }

            50% {
                transform: translate(1%, -1%);
            }

            75% {
                transform: translate(1%, 1%);
            }

            100% {
                transform: translate(-1%, -1%);
            }
        }


        /* ==================================================
           VIGNETTE
        ================================================== */

        .vignette {
            position: absolute;

            inset: 0;

            z-index: 15;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 40%,
                    rgba(0,0,0,0.22) 72%,
                    rgba(0,0,0,0.65) 100%
                );
        }


        /* ==================================================
           FIRST MEMORY SECTION
        ================================================== */

        .memory {
            position: absolute;

            inset: 0;

            z-index: 5;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow-y: auto;

            padding: 70px 25px;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(67, 48, 35, 0.16),
                    #090807 68%
                );

            opacity: 0;

            animation: memoryAppear 2.5s ease 9.8s forwards;
        }

        @keyframes memoryAppear {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .memory-inner {
            width: min(900px, 92vw);

            text-align: center;
        }


        /* ==================================================
           MEMORY NARRATION
        ================================================== */

        .memory-intro {
            max-width: 650px;

            margin: 0 auto 55px;

            font-size: clamp(1.35rem, 2.4vw, 2rem);

            line-height: 1.6;

            font-weight: 300;

            color: #ddd2c7;

            opacity: 0;

            animation: textReveal 2s ease 11s forwards;
        }

        @keyframes textReveal {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(3px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }


        /* ==================================================
           SCREENSHOT
        ================================================== */

        .memory-image-wrap {
            position: relative;

            width: min(380px, 78vw);

            margin: 0 auto;

            opacity: 0;

            transform: translateY(30px) scale(0.97);

            animation:
                imageReveal 2.5s cubic-bezier(.22,.61,.36,1) 12.3s forwards;
        }

        @keyframes imageReveal {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .memory-image {
            display: block;

            width: 100%;
            height: auto;

            border-radius: 3px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.65),
                0 0 0 1px rgba(190,165,140,0.10);
        }


        /* ==================================================
           TEXT AFTER SCREENSHOT
        ================================================== */

        .memory-text {
            max-width: 650px;

            margin: 55px auto 0;

            font-size: clamp(1.2rem, 2vw, 1.65rem);

            line-height: 1.7;

            font-weight: 300;

            color: #cfc4b9;

            opacity: 0;

            animation: textReveal 2s ease 14.8s forwards;
        }

        .memory-text em {
            color: #e4d7ca;
            font-style: italic;
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 600px) {

            .hello {
                font-size: 2.7rem;
            }

            .date {
                font-size: 0.75rem;

                letter-spacing: 0.3em;

                margin-left: 0.3em;
            }

            .birthday {
                font-size: 1.35rem;
            }

            .moon {
                right: 8%;
                top: 13%;
            }

            .star1 {
                left: 10%;
            }

            .star2 {
                right: 10%;
            }

            .curve1 {
                left: -130px;
            }

            .curve2 {
                right: -130px;
            }

            .memory {
                align-items: flex-start;

                padding-top: 90px;
            }

            .memory-intro {
                margin-bottom: 40px;

                font-size: 1.3rem;

                padding: 0 10px;
            }

            .memory-image-wrap {
                width: min(360px, 88vw);
            }

            .memory-text {
                font-size: 1.2rem;

                padding: 0 12px;

                margin-top: 40px;
            }
        }
    </style>
</head>


<body>


    <!-- ==================================================
         OPENING
    ================================================== -->

    <section class="opening screen">

        <div class="light"></div>


        <!-- Stars -->

        <div class="star star1"></div>
        <div class="star star2"></div>
        <div class="star star3"></div>
        <div class="star star4"></div>


        <!-- Dust -->

        <div class="dust dust1"></div>
        <div class="dust dust2"></div>
        <div class="dust dust3"></div>
        <div class="dust dust4"></div>
        <div class="dust dust5"></div>


        <!-- Crescent -->

        <div class="moon">

            <svg viewBox="0 0 40 40">

                <path d="
                    M29 6
                    C20 8, 14 15, 14 23
                    C14 31, 20 35, 28 34
                    C22 32, 18 27, 18 21
                    C18 14, 22 9, 29 6
                "/>

            </svg>

        </div>


        <!-- Curved lines -->

        <div class="curve curve1">

            <svg viewBox="0 0 300 150">

                <path d="
                    M0 110
                    C70 35, 160 25, 300 70
                "/>

            </svg>

        </div>


        <div class="curve curve2">

            <svg viewBox="0 0 300 150">

                <path d="
                    M0 75
                    C100 20, 200 35, 300 120
                "/>

            </svg>

        </div>


        <!-- Main opening text -->

        <div class="opening-content">

            <div class="hello">
                Hi babyyyyyy
            </div>

            <div class="date">
                27 . 09 . 2026
            </div>

            <div class="divider"></div>

            <div class="birthday">
                Happy birthday, my love.
            </div>

        </div>


        <div class="grain"></div>

        <div class="vignette"></div>

    </section>



    <!-- ==================================================
         FIRST MEMORY
    ================================================== -->

    <section class="memory screen">

        <div class="memory-inner">


            <div class="memory-intro">

                I didn't know you were going to become
                this important to me.

            </div>


            <div class="memory-image-wrap">

                <img
                    class="memory-image"
                    src="mere-saath-nahi.png"
                    alt="An early conversation"
                >

            </div>


            <div class="memory-text">

                Maybe that was the first little sign.

                <br><br>

                You didn't just want to be someone
                I talked to when Nisha was around.

                <br>

                You wanted me to call you, too.

                <br><br>

                And somehow, I did.

            </div>


        </div>

    </section>


</body>
</html>
